name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Caches npm packages to speed up builds

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test # Prevents deployment if tests fail
    steps:
      - name: Trigger Server Deployment
        run: |
          curl --fail \
               --retry 3 \
               --max-time 10 \
               -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
