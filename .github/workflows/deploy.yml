name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Trigger Server Deployment
        # This pings your server manager (e.g., EasyPanel) to pull and build the new Docker image
        run: curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"