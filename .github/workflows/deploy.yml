name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Caches npm packages to speed up builds

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Report failure
        if: failure()
        run: |
          echo "::error title=Tests failed::npm test failed. The deploy job was skipped."
          {
            echo "## ❌ Tests failed — deploy skipped"
            echo ""
            echo "The **Run Tests** step failed, so the \`deploy\` job did not run."
            echo ""
            echo "Run \`npm run check\` locally before pushing to catch this earlier."
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Triggered by: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test # Prevents deployment if tests fail
    if: github.event_name == 'push'
    steps:
      - name: Trigger Server Deployment
        run: |
          curl --fail \
               --retry 3 \
               --retry-connrefused \
               --max-time 10 \
               -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
